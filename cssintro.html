<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to CSS</title>
    <style>
        main {
            margin: 0 auto;
            align-items: center;
            font-family: sans-serif;
        }

        .shape {
            width: 10px;
            height: 50px;
            padding: 10px;
            border-radius: 500px;
            margin-inline: 5px;
        }

        .parent {
            padding: 1rem
        }

        .ph-scale {
            display: flex;
            width: 600px;
            margin: 20px auto;
            /* border: 1px solid #ccc; */
        }

        .ph-0 {
            background-color: rgb(255, 0, 0);
        }

        .ph-1 {
            background-color: rgb(255, 51, 0);
        }

        .ph-2 {
            background-color: rgb(255, 102, 0);
        }

        .ph-3 {
            background-color: rgb(255, 153, 0);
        }

        .ph-4 {
            background-color: rgb(246, 197, 1);
        }

        .ph-5 {
            background-color: rgb(255, 255, 0);
        }

        .ph-6 {
            background-color: rgb(204, 255, 0);
        }

        .ph-7 {
            background-color: rgb(0, 255, 0);
        }

        .ph-8 {
            background-color: rgb(0, 204, 0);
        }

        .ph-9 {
            background-color: rgb(0, 153, 0);
        }

        .ph-10 {
            background-color: rgb(0, 102, 0);
        }

        .ph-11 {
            background-color: rgb(0, 51, 0);
        }

        .ph-12 {
            background-color: rgb(51, 0, 204);
        }

        .ph-13 {
            background-color: rgb(102, 0, 153);
        }

        .ph-14 {
            background-color: rgb(153, 0, 102);
        }

        .ph-15 {
            background-color: rgb(106, 3, 71);
        }

        .labels {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin: 10px auto;
        }

        .label {
            text-align: center;
        }

        .ph-number {
            margin-top: 7px;
            margin-left: 15px;
        }

        .arrow {
            background: black;
            width: 270px;
            height: 2px;
            position: relative;
        }

        .arrow::before {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 12px solid black;
            top: -4px;
            left: -3px;
        }

        .arrow::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 12px solid black;
            top: -4px;
            right: -3px;
        }
    </style>
</head>

<body>

    <main>
        <section>
            <h1 align="center">pH scale</h1>
        </section>
        <section>
            <div style="display: inline;">
                <div class="parent ph-scale">
                    <div>
                        <div class="shape child inline-block-child ph-1"></div>
                        <div class="ph-number">0</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-2"></div>
                        <div class="ph-number">1</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-3"></div>
                        <div class="ph-number">2</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-4"></div>
                        <div class="ph-number">3</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-5"></div>
                        <div class="ph-number">4</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-6"></div>
                        <div class="ph-number">5</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-7"></div>
                        <div class="ph-number">6</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-8"></div>
                        <div class="ph-number">7</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-8"></div>
                        <div class="ph-number">8</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-10"></div>
                        <div class="ph-number">9</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-11"></div>
                        <div class="ph-number">10</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-12"></div>
                        <div class="ph-number">11</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-13"></div>
                        <div class="ph-number">12</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-14"></div>
                        <div class="ph-number">13</div>
                    </div>
                    <div>
                        <div class="shape child inline-block-child ph-15"></div>
                        <div class="ph-number">14</div>
                    </div>
                </div>
                <div class="labels">
                    <div class="label arrow"> </div>
                    <div>
                        |
                    </div>
                    <div class="label arrow"> </div>
                </div>
                <div class="labels">
                    <div class="label">Acidic</div>
                    <div class="label">Neutral</div>
                    <div class="label">Alkaline</div>
                </div>
            </div>

        </section>
    </main>

</body>

</html>
